<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Offset</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <div class="container">
          <div class="row">
               <div class="col-md-4 p-3 bg-dark text-white">col-md-4</div>
               <div class="col-md-4 p-3 bg-danger offset-md-4 text-white">col-md-4 .offset-md-4</div>
          </div>

          <div class="row">
               <div class="col-md-3 offset-md-3 bg-danger p-3 text-white">offset-md-3</div>
               <div class="col-md-3 offset-md-3 bg-warning p-3 text-white">col-md-3</div>
          </div>

          <div class="row">
               <div class="col-md-6 offset-md-3 p-3 bg-dark text-white">col-md-6</div>
          </div>
     </div>
</body>
</html>
