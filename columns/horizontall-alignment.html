<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>horizontall-alignment</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
      <div class="container">
          <div class="row jusify-content-start">
               <div class="col-4 p-3 bg-dark text-white">column1</div>
               <div class="col-4 p-3 bg-danger text-white">column2</div>
          </div>
          <div class="row justify-content-center">
               <div class="col-4 p-3 bg-success text-white">column1</div>
               <div class="col-4 p-3 bg-warning text-white">column2</div>
          </div>
          <div class="row justify-content-end">
               <div class="col-4 p-3 bg-dark text-white">column1</div>
               <div class="col-4 p-3 bg-danger text-white">column2</div>
          </div>
          <div class="row justify-content-around">
               <div class="col-4 p-3 bg-primary text-white">column1</div>
               <div class="col-4 p-3 bg-success text-white">column2</div>
          </div>
          <div class="row justify-content-between">
               <div class="col-4 p-3 bg-danger text-white">column1</div>
               <div class="col-4 p-3 bg-dark text-white">column2</div>
          </div>
          <div class="row justify-content-evenly">
               <div class="col-4 p-3 bg-success text-white">column1</div>
               <div class="col-4 p-3 bg-primary text-white">column2</div>
          </div>
      </div>
</body>
</html>
