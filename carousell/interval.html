<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Interval</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>

<body>
     <div id="carouselExampleInterval" class="carousel slide" style="height: 500px;" data-bs-ride="carousel">
          <div class="carousel-inner">
               <div class="carousel-item active" data-bs-interval="1000">
                    <img src="https://cdn.pixabay.com/photo/2016/11/18/16/19/flowers-1835619_640.jpg"
                         class="d-block w-100" alt="pixabay">
               </div>
               <div class="carousel-item" data-bs-interval="2000">
                    <img src="https://images.pexels.com/photos/381739/pexels-photo-381739.jpeg?auto=compress&cs=tinysrgb&dpr=1&w=500"
                         class="d-block w-100" alt="pexels">
               </div>
               <div class="carousel-item" data-bs-interval="3000">
                    <img src="https://thumbs.dreamstime.com/b/closeup-view-tree-branches-tiny-flowers-outdoors-space-text-amazing-spring-blossom-145967516.jpg"
                         class="d-block w-100" alt="dreamstime">
               </div>
          </div>

          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="prev">
               <span class="carousel-control-prev-icon" aria-hidden="true"></span>
               <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="next">
               <span class="carousel-control-next-icon" aria-hidden="true"></span>
               <span class="visually-hidden">Next</span>
          </button>
     </div>
     <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
