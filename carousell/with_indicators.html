<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>With_Indicators</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>

<body>
     <div id="carosuelExampleIndicators" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-indicators">
               <button type="button" data-bs-target="#carosuelExampleIndicators" data-bs-slide-to="0" class="active"
                    aria-current="true" aria-label="Slide 1"></button>
               <button type="button" data-bs-target="#carosuelExampleIndicators" data-bs-slide-to="1"
                    aria-label="Slide 2"></button>
               <button type="button" data-bs-target="#carosuelExampleIndicators" data-bs-slide-to="2"
                    aria-label="Slide 3"></button>
          </div>

          <div class="carousel-inner" style="height: 30rem;">
               <div class="carousel-item active">
                    <img src="https://media.istockphoto.com/id/1403500817/photo/the-craggies-in-the-blue-ridge-mountains.jpg?s=612x612&w=0&k=20&c=N-pGA8OClRVDzRfj_9AqANnOaDS3devZWwrQNwZuDSk="
                     class="d-block w-100"  alt="">
               </div>
               <div class="carousel-item">
                    <img src="https://media.istockphoto.com/id/1403500817/photo/the-craggies-in-the-blue-ridge-mountains.jpg?s=612x612&w=0&k=20&c=N-pGA8OClRVDzRfj_9AqANnOaDS3devZWwrQNwZuDSk="
                     class="d-block w-100"  alt="">
               </div>
               <div class="carousel-item">
                    <img src="https://media.istockphoto.com/id/1403500817/photo/the-craggies-in-the-blue-ridge-mountains.jpg?s=612x612&w=0&k=20&c=N-pGA8OClRVDzRfj_9AqANnOaDS3devZWwrQNwZuDSk="
                     class="d-block w-100"  alt="">
               </div>
          </div>
          
          <button class="carousel-control-prev" type="button" data-bs-target="#carosuelExampleIndicators" data-bs-slide="prev">
               <span class="carousel-control-prev-icon" aria-hidden="true"></span>
               <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carosuelExampleIndicators" data-bs-slide="next">
               <span class="carousel-control-next-icon"aria-hidden="true"></span>
               <span class="visually-hidden">Next</span>
          </button>
     </div>

     <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
