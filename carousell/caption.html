<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Caption</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<style>
     img{
          height: 500px;
     }
</style>
<body>
     <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" style="height: 30rem;">
          <div class="carousel-indicators">
               <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
               <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
               <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
          </div>

          <div class="carousel-inner">
               <div class="carousel-item active">
                    <img src="https://cdn.pixabay.com/photo/2016/11/18/16/19/flowers-1835619_640.jpg"class="d-block w-100" alt="pixabay">
                    <div class="carousel-caption d-none d-md-block">
                         <h5>First slide label</h5>
                         <p>Some representative placeholder content for the first slide.</p>
                    </div>
               </div>
               <div class="carousel-item">
                    <img src="https://images.pexels.com/photos/381739/pexels-photo-381739.jpeg?auto=compress&cs=tinysrgb&dpr=1&w=500"
                        class="d-block w-100" alt="pexels">
                    <div class="carousel-caption d-none d-md-block">
                         <h5>Second slide label</h5>
                         <p>Some representative placeholder content for the second slide.</p>
                    </div>
               </div>
               <div class="carousel-item">
                    <img src="https://thumbs.dreamstime.com/b/closeup-view-tree-branches-tiny-flowers-outdoors-space-text-amazing-spring-blossom-145967516.jpg"
                        class="d-block w-100" alt="dreamstime">
                    <div class="carousel-caption d-none d-md-block">
                         <h5>Third slide label</h5>
                         <p>Some representative placeholder content for the second slide.</p>
                    </div>
               </div>
          </div>

          <button type="button" class="carousel-control-prev" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
               <span class="carousel-control-prev-icon"></span>
               <span class="visually-hidden">Previous</span>
          </button>
          <button type="button" class="carousel-control-next" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
               <span class="carousel-control-next-icon"></span>
               <span class="visually-hidden">Next</span>
          </button>
     </div>

     <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
