<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Disable Touch Swiping</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
     <style>
          img{
               height: 30rem;
          }
     </style>
</head>
<body>
     <div id="carouselExampleControlNoTouching" class="carousel slide" data-bs-touch="false" data-bs-interval="false" style="height: 30rem;">
          <div class="carousel-inner">
               <div class="carousel-item active">
                    <img src="https://thumbs.dreamstime.com/b/closeup-view-tree-branches-tiny-flowers-outdoors-space-text-amazing-spring-blossom-145967516.jpg"
                    class="d-block w-100" alt="dreamstime">
               </div>

               <div class="carousel-item">
                    <img src="https://images.pexels.com/photos/381739/pexels-photo-381739.jpeg?auto=compress&cs=tinysrgb&dpr=1&w=500"
                        class="d-block w-100" alt="pexels">
               </div>

               <div class="carousel-item">
                    <img src="https://cdn.pixabay.com/photo/2016/11/18/16/19/flowers-1835619_640.jpg"class="d-block w-100" alt="pixabay">
                    <div class="carousel-caption d-none d-md-block">
               </div>
          </div>


          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControlNoTouching" data-bs-slide="prev">
               <span class="carousel-control-prev-icon" aria-hidden="true"></span>
               <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControlNoTouching" data-bs-slide="next">
               <span class="carousel-control-next-icon" aria-hidden="true"></span>
               <span class="visually-hidden">Next</span>
          </button>
     </div>

     <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
