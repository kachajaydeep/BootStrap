<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>data-bs-parent</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <div class="accordion" id="accordionFlushExample">
          <div class="accordion-item">
               <h2 class="accordion-header" id>
                    <button class="accordion-header" data-bs-toggle="collapse" data-bs-target="#panelOne">Accordion Item 1</button>
               </h2>
               <div class="accordion-collapse collapse show" id="panelOne">
                    <div class="accordion-body">
                         <strong>This is a the first Stream of a body.</strong>
                    </div>
               </div>
          </div>


          <h2 class="accordion-header">
               <button class="accrodion-button" type="button" data-bs-toggle="collapse" data-bs-target="#panelTwo"></button>
          </h2>
     </div>
     <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
