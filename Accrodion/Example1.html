<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Accrodion_Example1</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <div class="accordion" id="accordionExample">
          <div class="accordion-item">
               <h2 class="accordion-header" id="headingOne">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">Collapse One</button>
               </h2>

               <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne" data-bs-parent="#accordionExample">
                    <div class="accordion-body">
                         <strong>This is the first item's accordion body.</strong>
                    </div>
               </div>
          </div>

          <!--second Accordion-->
          <div class="accordion-item">
               <h2 class="accordion-header" id="headingTwo">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo">Collapse Two</button>
               </h2>

               <div id="collapseTwo">
                    <div class="accordion-body">
                         <strong>This is a Second item's accordion body.</strong>
                    </div>
               </div>
          </div>

          <!--Third Accordion-->
          <div class="accordion-item">
               <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree">CollapseThree</button>
               </h2>
               <div id="collapseThree">
                    <div class="accordion-body">
                         <strong>This is the Third item's accordion body.</strong>
                    </div>
               </div>

          </div>
     </div>

     <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>
