<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Adds-in-Forms</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <div class="btn-group">
          <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">DropDown</button>
          <div class="dropdown-menu">
               <form class="px-4 py-3">
                    <div class="mb-3">
                         <label for="exampleDropdownFormEmail1" class="form-label">Email address</label>
                         <input type="email" class="form-control" id="exampleDropdownFormEmail1" placeholder="email@exmple.com">
                    </div>

                    <div class="mb-3">
                         <label for="exampleDropdownFormPassword1" class="form-label">Password</label>
                         <input type="password" class="form-control" id="exampleDropdownFormPassword1" placeholder="Password">
                    </div>
                    <div class="mb-3">
                         <div class="form-check">
                              <input type="checkbox" id="dropdowncheck" class="form-check-input">
                              <label for="dropdowncheck">
                                   Remember me
                              </label>
                         </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign in</button>
               </form>
               <div class="dropdown-divider"></div>
               <a href="#" class="dropdown-item">New around here? Sign up</a>
               <a href="#" class="dropdown-item">Forgot password?</a>
          </div>
     </div>

     <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
