<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>checkbox_btn</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <div class="btn-group" aria-label="Basic checkbox toggle buttob group">
          <input type="checkbox" class="btn-check" name="btn-check" id="btncheck1" autocomplete="off">
          <label for="btncheck1" class="btn btn-outline-primary">checkbox1</label>

          <input type="checkbox" class="btn-check" name="btn-check" id="btncheck2" autocomplete="off">
          <label for="btncheck2" class="btn btn-outline-success">checkbox2</label>

          <input type="checkbox" class="btn-check" name="btn-check" id="btncheck3" autocomplete="off">
          <label for="btncheck3" class="btn btn-outline-primary">checkbox3</label>
     </div>
</body>
</html>
