<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>button-toolbar</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <h5>Combine Button-Group Class use button-toolbar</h5>
     <div class="btn-toolbar">
          <div class="btn-group me-2">
               <button class="btn btn-primary">1</button>
               <button class="btn btn-primary">2</button>
               <button class="btn btn-primary">3</button>
          </div>

          <div class="btn-group me-2">
               <div class="btn btn-success">4</div>
               <div class="btn btn-success">5</div>
               <div class="btn btn-success">6</div>
          </div>

          <div class="btn-group">
               <div class="btn btn-danger">7</div>
               <div class="btn btn-danger">8</div>
               <div class="btn btn-danger">9</div>
          </div>
     </div>
</body>
</html>
