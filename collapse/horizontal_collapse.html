<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Horizontal-Collapse</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
     <p>
          <button type="button" class="btn btn-primary collapsed" data-bs-target="#horizontalcollapse"
               data-bs-toggle="collapse" aria-expanded="false">Toggle With Collapse</button>
     </p>
     <div style="min-height: 120px;">
          <div class="collapse collapse-horizontal" id="horizontalcollapse">
               <div class="card card-body" style="width: 300px;">
                    This is some placeholder content for a horizontal collapse. It's hidden by default and shown when
                    triggered.
               </div>
          </div>
     </div>
</body>

</html>
