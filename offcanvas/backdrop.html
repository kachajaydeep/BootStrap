<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Backdrop_filter</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>

<body>
     <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasBottom">Toggle
          bottom offcanvas</button>
     <div class="offcanvas offcanvas-bottom" tabindex="-1" id="offcanvasBottom" data-bs-backdrop="false">
          <div class="offcanvas-header">
               <h5 class="offcanvas-title" id="offcanvasBottomLabel">offcanvas Label</h5>
               <button class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
          </div>
          <div class="offcanvas-body small">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Unde natus laborum
               eum numquam quod, velit inventore? Magni iste qui non?
          </div>
     </div>
     <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
