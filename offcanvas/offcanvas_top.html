<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>OffCanvas_top</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>

<body>
     <button class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#offcanvas">Toggle top
          offcanvas</button>
     <div class="offcanvas offcanvas-top" id="offcanvas" tabindex="-1">
          <div class="offcanvas-header">
               <h5 id="offcanvasTopLabel">offcanvas Top</h5>
               <button class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
          </div>
          <div class="offcanvas-body">
               Content for the offcanvas goes here. You can place just about any Bootstrap component or custom elements
               here.
          </div>
     </div>
     <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
