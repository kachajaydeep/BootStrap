<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Offcanvas_Right</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>

<body>
     <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas"
          data-bs-target="#offCanvas">OffCanvasRight</button>

     <div class="offcanvas offcanvas-bottom" id="offCanvas">
          <div class="offcanvas-header">
               <h5 id="offcanvasRightLabel">offcanvasRight</h5>
               <button class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
          </div>

          <div class="offcanvas-body">
               Lorem ipsum dolor sit amet consectetur adipisicing elit. Blanditiis minima autem pariatur voluptas,
               deserunt molestiae id perspiciatis recusandae eaque iusto.
          </div>
     </div>
     <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
