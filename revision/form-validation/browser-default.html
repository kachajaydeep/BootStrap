<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Browser-Default</title>
     <link rel="stylesheet" href="../../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>

<body>
     <div class="container mt-3">

          <form class="row g-3">
               <div class="col-md-4">
                    <label for="validationDefault01" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="validationDefault01" value="Mark" required>
               </div>

               <div class="col-md-4">
                    <label for="validationDefault02" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="validationDefault02" value="Otto" required>
               </div>
               <div class="col-md-4">
                    <label for="validationDefault03" class="form-label">UserName</label>
                    <div class="input-group">
                         <span for="usernameinput" class="input-group-text">@</span>
                         <input type="text" id="usernameinput" class="form-control">
                    </div>
               </div>

               <div class="col-md-6">
                    <label for="validationDefault04" class="form-label">City</label>
                    <input type="text" class="form-control">
               </div>

               <div class="col-md-3">
                    <label for="validationDefault05" class="form-label">State</label>
                    <select id="validationDefault05" class="form-select">
                         <option value="1">Gujarat</option>
                         <option value="2">maharashtra</option>
                         <option value="3">Rajasthan</option>
                    </select>
               </div>
               <div class="col-md-3">
                    <label for="validationDefault06" class="form-label">PinCode</label>
                    <input type="text" class="form-control" id="validationDefault06">
               </div>

               <div class="col-12">
                    <div class="form-check">
                         <input type="checkbox" id="formchecking" class="form-check-input">
                         <label for="formchecking">Agree to terms and conditions</label>
                    </div>
               </div>

               <div class="col-12">
                    <button class="btn btn-primary" type="submit">Submit Form</button>
               </div>
          </form>
     </div>
</body>

</html>
