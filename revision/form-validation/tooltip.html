<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Tooltip</title>
     <link rel="stylesheet" href="../../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>

<body>
     <form class="row g-3 needs-validation" novalidate>
          <div class="col-md-4 position-relative">
               <label for="validationTooltip01" class="form-label">First Name</label>
               <input type="text" class="form-control" id="validation-tooltip01" value="Mark" required>
               <div class="valid-tooltip">Looks Good!</div>
          </div>

          <div class="col-md-4 position-relative">
               <label for="validationTooltip02" class="form-label">Last Name</label>
               <input type="text" id="validation-tooltip01" value="Mark" required>
               <div class="valid-tooltip">Looks Good!</div>
          </div>

          <div class="col-md-4 postion-relative">
               <label for="validationTooltip03" class="form-label">UserName</label>
               <div class="input-group has-validation">
                    <span class="input-group-text" id="validationTooltipUsernamePrepend">@</span>
                    <input type="text" class="form-control" id="validationTooltipUsername" required>
                    <div class="invalid-tooltip">
                         Please choose a unique and valid username.
                    </div>
               </div>
          </div>

          <div class="col-md-6 position-relative">
               <label for="validationTooltip03" class="form-label">City</label>
               <input type="text" class="form-control" id="validationTooltip03">
               <div class="invalid-tooltip">Please Provide a valid city</div>
          </div>

          <div class="col-md-3 position-relative">
               <label for="validationTooltip04" class="form-label">State</label>
               <select class="form-select" id="validationTooltip04" required>
                    <option selected disabled value="">Choose...</option>
                    <option>...</option>
               </select>
               <div class="invalid-tooltip">
                    Please select a valid state.
               </div>
          </div>
          <div class="col-md-3 position-relative">
               <label for="validationTooltip05" class="form-label">Zip</label>
               <input type="text" class="form-control" id="validationTooltip05" required>
               <div class="invalid-tooltip">
                    Please provide a valid zip.
               </div>
          </div>
          <div class="col-12">
               <button class="btn btn-primary" type="submit">Submit form</button>
          </div>
     </form>

     <script>
          (() => {
               'use strict'

               // Fetch all the forms we want to apply custom Bootstrap validation styles to
               const forms = document.querySelectorAll('.needs-validation')

               // Loop over them and prevent submission
               Array.from(forms).forEach(form => {
                    form.addEventListener('submit', event => {
                         if (!form.checkValidity()) {
                              event.preventDefault()
                              event.stopPropagation()
                         }

                         form.classList.add('was-validated')
                    }, false)
               })
          })()
     </script>
</body>

</html>
