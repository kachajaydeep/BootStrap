<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Custom-Style</title>
     <link rel="stylesheet" href="../../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>

<body>
     <form class="row g-3 needs-validation" novalidate>
          <div class="col-md-4">
               <label for="validationCustom01" class="form-label bg-opacity-10">First Name</label>
               <input type="text" class="form-control" id="validationCustom01">
               <div class="valid-feedback">
                    Let's Good!
               </div>
          </div>

          <div class="col-md-4">
               <label for="validationCustom02" class="form-label">Last Name</label>
               <input type="text" class="form-control" id="validationCustom02">
               <div class="valid-feedback">
                    Looks good!
               </div>
          </div>
          <div class="col-md-4">
               <label for="validationCustom02" class="form-label">Username</label>
               <div class="input-group has-validation">
                    <span class="input-group-text" id="inputGroupPrepend">@</span>
                    <input type="text" class="form-control" id="validationCustomUsername" required>
               </div>
          </div>

          <div class="col-md-6">
               <label for="validationCustom03" class="form-label">City</label>
               <input type="text" class="form-control" id="validationCustom03" required>
               <div class="invalid-feedback">
                    Please provide a valid city.
               </div>
          </div>
          <div class="col-md-3">
               <label for="validationCustom04" class="form-label">State</label>
               <select class="form-control" id="validationCustom04" required>
                    <option selected disabled value="">Choose...</option>
                    <option>...</option>
               </select>
               <div class="invalid-feedback">
                    Please select a valid state.
               </div>
          </div>

          <div class="col-md-3">
               <label for="validationCustom05" class="form-label">Pincode</label>
               <input type="text" id="validationCustom05" class="form-control" required>
               <div class="invalid-feedback">
                    Please Provide Valid PinCode.
               </div>
          </div>

          <div class="col-12">
               <div class="form-check">
                    <input type="checkbox" value="" class="form-check-input" id="invalidCheck" required>
                    <label for="invalidCheck" class="form-check-label">
                         Agree to terms and Conditions.
                    </label>

                    <div class="invalid-feedback">
                         You must agree before submitting.
                    </div>
               </div>
          </div>

          <div class="col-12">
               <button class="btn btn-primary" type="submit">Submit form</button>
          </div>
     </form>

     <script>
          (() => {
               'use strict'

               // Fetch all the forms we want to apply custom Bootstrap validation styles to
               const forms = document.querySelectorAll('.needs-validation')

               // Loop over them and prevent submission
               Array.from(forms).forEach(form => {
                    form.addEventListener('submit', event => {
                         if (!form.checkValidity()) {
                              event.preventDefault()
                              event.stopPropagation()
                         }

                         form.classList.add('was-validated')
                    }, false)
               })
          })()
     </script>
</body>

</html>
