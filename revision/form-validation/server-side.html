<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Server-Side</title>
     <link rel="stylesheet" href="../../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>

<body>
     <form class="row g-3">
          <div class="col-md-4">
               <label for="validationServer01" class="form-label">First Name</label>
               <input type="text" class="form-control is-valid" id="validationServer01" value="Otto" required>
               <div class="valid-feedback">
                    Looks Good!
               </div>
          </div>

          <div class="col-md-4">
               <label for="validationServer02" class="form-label">Last Name</label>
               <input type="text" class="form-control is-valid">
               <div class="valid-feedback">
                    Looks Good!
               </div>
          </div>
          <div class="col-md-4">
               <label for="validationServerUsername" class="form-label">Username</label>
               <div class="input-group has-validation">
                    <span class="input-group-text" id="inputGroupPrepend3">@</span>
                    <input type="text" class="form-control is-invalid" id="validationServerUsername" required>
                    <div class="invalid-feedback">
                         Please choose a username.
                    </div>
               </div>
          </div>

          <div class="col-md-6">
               <label for="validationServer03" class="form-label">City</label>
               <input type="text" id="validationServer03" class="form-control is-invalid" required>
          </div>

          <div class="col-md-3">
               <label for="validationServer04" class="form-label">State</label>
               <select class="form-select is-invalid" id="validationServer04" required>
                    <option value="1">Choose..</option>
                    <option value="2">...</option>
               </select>
          </div>
     </form>
</body>

</html>
