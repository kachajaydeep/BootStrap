<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Segmented_Button</title>
     <link rel="stylesheet" href="../../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <div class="input-group">
          <button class="btn btn-outline-secondary" type="button">DropDown</button>
          <button class="btn btn-outline-secondary dropdown-toggle dropdown-toggle-split" type="button" data-bs-toggle="dropdown">
               <span class="visually-hidden">Toggle Dropdown</span>
          </button>
          <ul class="dropdown-menu">
               <li><a href="" class="dropdown-item">Action</a></li>
               <li><a href="" class="dropdown-item">Another action</a></li>
               <li><a href="" class="dropdown-item">Something else here</a></li>
               <li><hr class="dropdown-divider"></li>
               <li><a href="" class="dropdown-item">Separated link</a></li>
          </ul>
          <input type="text" class="form-control">
     </div>
     <script src="../../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
