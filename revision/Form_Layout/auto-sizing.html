<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>auto-sizing</title>
     <link rel="stylesheet" href="../../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <form class="row gy-2 gx-3 align-items-center">
          <div class="col-auto">
               <label for="autoSizingInput" class="visually-hidden">Name</label>
               <input type="text" placeholder="Deep Poradiya" id="autoSizingInput" class="form-control">
          </div>
          <div class="col-auto">
               <label for="autoSizingInputGroup" class="visually-hidden">Username</label>
               <div class="input-group">
                    <div class="input-group-text">@</div>
                    <input type="text" placeholder="UserName" id="autoSizingInputGroup" class="form-control">
               </div>
          </div>
     </form>
</body>
</html>
