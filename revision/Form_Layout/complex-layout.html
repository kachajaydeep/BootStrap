<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Complex Layout</title>
     <link rel="stylesheet" href="../../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>

<body>
     <div class="container mt-5">
          <form class="row g-3 border p-3">
               <div class="col-md-6">
                    <label for="emailinput" class="form-label">Email</label>
                    <input type="email" id="emailinput" class="form-control">
               </div>
               <div class="col-md-6">
                    <label for="EnterYourPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="EnterYourPassword">
               </div>
               <div class="col-12">
                    <label for="EnterYourAddress" class="form-label">Address</label>
                    <input type="text" class="form-control" id="EnterYourAddress">
               </div>

               <div class="col-12">
                    <label for="EnterYourAddress2" class="form-label">Address-2</label>
                    <input type="text" class="form-control" id="EnterYourAddress2">
               </div>

               <div class="col-md-6">
                    <label for="EnterYourCity" class="form-label">City</label>
                    <input type="text" id="EnterYoutCity" class="form-control">
               </div>

               <div class="col-md-4">
                    <label for="FormInputState" class="form-label">State</label>
                    <select id="inputState" class="form-select">
                         <option value="Gujarat" selected>GUJARAT</option>
                         <option value="Rajasthan">Rajasthan</option>
                    </select>
               </div>

               <div class="col-md-2">
                    <label for="inputzip" class="form-label">Zip</label>
                    <input type="text" class="form-control" id="inputzip">
               </div>

               <div class="col-12">
                    <div class="form-check">
                         <input type="checkbox" id="gridcheck" class="form-check-input">
                         <label for="form-check-label" for="gridcheck">
                              Check me out
                         </label>
                    </div>
               </div>

               <div class="d-grid col-md-2">
                    <button type="submit" class="btn btn-primary">Sign in</button>
               </div>
          </form>
     </div>

</body>

</html>
