<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Form-Label</title>
     <link rel="stylesheet" href="../../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <div class="mb-3">
          <label for="exampleformControlInput1" class="form-label">Email address</label>
          <input type="email" class="form-control" id="exampleformControlInput1" placeholder="deep123@gmail.com">
     </div>

     <div class="mb-3">
          <label for="exampleformControlTextarea1" class="form-label">Example Text-area</label>
          <textarea type="email" class="form-control" id="exampleformControlTextarea1">
     </div>
</body>
</html>
