<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Radio_Button</title>
     <link rel="stylesheet" href="../../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <!-- please! please ! note that here name attribute value take same because it's smae group and choose only one. -->
     <div class="form-check">
          <input type="radio" class="form-check-input" name="flexradiodefault" id="flexRadioDefault1">
          <label for="flexRadioDefault1" class="form-check-label">Default-radio</label>
     </div>

     <div class="form-check">
          <input type="radio" id="flexcheckdefault2" name="flexradiodefault" class="form-check-input" checked>
          <label for="flexcheckdefault2" class="form-check-label">It's Checked</label>
     </div>
</body>
</html>
