<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Default-Checks</title>
     <link rel="stylesheet" href="../../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <div class="form-check">
          <input type="checkbox" id="flexCheckDefault" class="form-check-input">
          <label class="form-check-label" for="flexCheckDefault">Default CheckBoxs</label>
     </div>

     <div class="form-check">
          <input class="form-check-input" type="checkbox" id="formchecked" checked>
          <label for="fornchecked" class="form-check-label"> Checked Checkbox</label>

     </div>
</body>
</html>
