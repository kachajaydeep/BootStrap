<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>form-switches</title>
     <link rel="stylesheet" href="../../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <div class="form-check form-switch">
          <input type="checkbox" class="form-check-input" id="formswitch1">
          <label for="formswitch1" class="form-check-label"></label>
     </div>
     <div class="form-check form-switch">
          <input type="checkbox" class="form-check-input" id="formswitch2" checked>
          <label for="formcheckswitch2" class="form-check-label"></label>
     </div>

     <div class="form-check form-switch">
          <input type="checkbox" name="" id="disableflex" class="form-check-input" disabled>
          <label for="disableflex" class="form-check-label"></label>
     </div>
</body>
</html>
