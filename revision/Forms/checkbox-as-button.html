<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>checkbox-as-buton</title>
     <link rel="stylesheet" href="../../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <input type="checkbox" autocomplete="off" id="btn-check" class="btn-check">
     <label for="btn-check" class="btn btn-primary">Single-toggle</label>

     <input type="checkbox" autocomplete="off" id="btn-check-2" class="btn-check" checked>
     <label for="btn-check-2" class="btn btn-danger">checked</label>
</body>
</html>
