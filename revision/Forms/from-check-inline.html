<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Form-check-inline</title>
     <link rel="stylesheet" href="../../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" value="" id="Inline1">
          <label for="Inline1" class="form-check-label">1</label>
     </div>

     <div class="form-check form-check-inline">
          <input type="checkbox" id="Inline2" class="form-check-input">
          <label for="Inline2" class="form-check-label">2</label>
     </div>

     <div class="form-check form-check-inline">
          <input type="checkbox" class="form-check-input" id="Inline3">
          <label for="Inline3" class="form-check-label">3</label>
     </div>
</body>
</html>
