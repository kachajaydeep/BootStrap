<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Hide_The_Toast</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
     <button class="btn btn-primary" type="button" id="liveToastBtn">Show Live Toast</button>

     <div class="toast-fixed bottom-0 end-0 p-3" style="position: fixed;">
          <div id="liveToast" class="toast hide show" role="alert" aria-live="assertive" aria-atomic="true"></div>
          <div class="toast-header">
               <img src="../leaf.jpg" alt="" width="10" height="10">
               <strong class="me-auto">Bootstrap</strong>
          </div>
          <div class="toast-body"></div>
     </div>
</body>
</html>
