<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>btn_tooltip</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <span >
          <button data-bs-placement="bottom" class="btn btn-secondary tool"  data-bs-toggle="tooltip" data-bs-custom="custom-tooltip" data-bs-title="This top tooltip is themed via CSS variables.">
               Custom tooltip
          </button>
     </span>

     <script>
          const tooltips = document.querySelectorAll(".tool");
          tooltips.forEach(t=> {
               new bootstrap.Tooltip(t);
          })
     </script>
     <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
