<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Modal</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#staticmodal">
          launch static modal
     </button>

     <div class="modal fade" id="staticmodal" data-bs-backdrop="static" tabindex="-1" data-bs-keyboard="false">
          <div class="modal-dialog">
               <div class="modal-content">
                    <div class="modal-header">
                         <h1 class="modal-title fs-5" id="staticBackdropLabel">Modal title</h1>
                         <button class="btn btn-danger btn-close" data-bs-dismiss="modal" type="button"></button>
                    </div>
                    <div class="modal-footer">
                         <button class="btn btn-primary" data-bs-dismiss="modal">close</button>
                    </div>
               </div>
          </div>
     </div>
     <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
