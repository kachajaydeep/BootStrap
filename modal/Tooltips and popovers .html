<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Tooltips and popovers</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>

<body>
     <button type="button" class="btn-primary" data-bs-toggle="modal" data-bs-target="#modal-pop">popover</button>
     <div class="modal fade" id="modal-pop" tabindex="-1">
          <div class="modal-dialog">
               <div class="modal-content">
                    <div class="modal-header">
                         <h2 class="modal-title">Modal Title</h5>
                    </div>

                    <div class="modal-body">
                         <h2 class="fs-5">Popover in Modal</h2>
                         <p>This <button class="btn-secondary" data-bs-toggle="popover" title="Popover title"
                                   data-bs-content="Popover body content is set in this attribute">button</button>triggers power on click.</p>
                         <hr>
                         <h2 class="fs-5">Tooltips in a modal.</h2>
                         <p><a href="#" data-bs-toggle="tooltip" title="Tooltip">This link</a> and <a href="#" data-bs-toggle="tooltip"></a></p>

                    </div>
               </div>
          </div>
     </div>

     <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
