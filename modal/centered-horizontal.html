<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Centered-horizontall</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <button class="btn btn-primary" data-bs-target="#modalhorizontal" data-bs-toggle="modal">open</button>
     <div class="modal fade" id="modalhorizontal" tabindex="-1">
          <div class="modal-dialog modal-dialog-centered">
               <div class="modal-content">
                    <div class="modal-header">
                         <h5 class="modal-title">Modal-Title</h5>
                         <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                         <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Modi, inventore!</p>
                    </div>
                    <div class="modal-footer">
                         <button class="btn btn-primary">success</button>
                         <button class="btn-danger btn" data-bs-dismiss="modal">close</button>
                    </div>
               </div>
          </div>
     </div>
     <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
