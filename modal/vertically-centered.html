<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>vertically-centered</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#verticallycentered">I am button</button>

     <div class="modal" id="verticallycentered" data-bs-toggle="popover" data-bs-content="Popover body content is set in this attribute.">
          <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
               <div class="modal-content" data-bs-close="">
                    <div class="modal-header">
                         <h5 class="modal-title">Modal title</h5>
                         <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                         <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Delectus, labore?</p>
                    </div>
                    <div class="modal-footer">
                         <button class="btn btn-danger" data-bs-dismiss="modal">close</button>
                         <button class="btn btn-primary">Success</button>
                    </div>
               </div>
          </div>
     </div>
     <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
