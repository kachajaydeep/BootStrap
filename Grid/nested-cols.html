<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Nested-Cols</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <div class="container">
          <div class="row">
            <div class="col-sm-3 p-3 bg-danger">
              Level 1: .col-sm-3
            </div>
            <div class="col-sm-9 bg-success">
              <div class="row">
                <div class="col-8 col-sm-6 p-3 bg-warning">
                  Level 2: .col-8 .col-sm-6
                </div>
                <div class="col-4 col-sm-6 p-3 bg-danger">
                  Level 2: .col-4 .col-sm-6
                </div>
              </div>
            </div>
          </div>
        </div> 
</body>
</html>
