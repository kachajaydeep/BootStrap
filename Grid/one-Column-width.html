<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>one-Column-width</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <div class="container">
          <div class="row">
               <div class="col p-3 bg-danger text-white">column1</div>
               <div class="col-6 p-3 bg-warning">column2</div>
               <div class="col p-3 bg-success">column3</div>
          </div>

          <div class="row">
               <div class="col p-3 bg-dark text-white">column1</div>
               <div class="col-5 p-3 bg-danger text-white">column2</div>
               <div class="col p-3 bg-primary">column3</div>
          </div>
     </div>
</body>
</html>
