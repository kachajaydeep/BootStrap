<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Mix_and_Match</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <div class="container">
          <div class="row">
               <div class="col-md-8 bg-danger p-3 text-white">col-md-8</div>
               <div class="col-md-4 bg-success p-3 text-white">col-md-4</div>
          </div>

          <div class="row">
               <div class="col-8 col-md-4 p-3 bg-dark text-white">col-6 col-md-4</div>
               <div class="col-4 col-md-4 p-3 bg-success">col-6 col-md-4</div>
               <div class="col-4 col-md-4 p-3 bg-danger text-white">col-6 col-md-4</div>
          </div>

          <div class="row">
               <div class="col6 p-3 bg-warning">col-6</div>
               <div class="col6 p-3 bg-success">col-6</div>
          </div>
     </div>
</body>
</html>
