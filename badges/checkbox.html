<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>checkbox-radio</title>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
     <ul class="list-group">
          <li class="list-group-item">
               <input type="checkbox" class="form-check-input me-1" id="firstcheckbox">
               <label for="firstcheckbox" class="form-check-label">First checkbox</label>
          </li>
          <li class="list-group-item">
               <input type="checkbox" id="secondcheckbox" class="form-check-input me-1">
               <label for="secondcheckbox" class="form-check-label">Second checkbox</label>
          </li>
          <li class="list-group-item">
               <input type="checkbox" id="thirdcheckbox" class="form-check-input me-1">
               <label for="thirdcheckbox" class="form-check-label">Third Checkbox</label>
          </li>
     </ul>
</body>
</html>
